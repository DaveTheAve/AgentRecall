[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-recall-hermes-plugin"
version = "0.3.0"
description = "Local-first, host-agnostic memory engine with native Hermes, OpenClaw, and MCP adapters"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Campbell" }]
keywords = ["memory", "embeddings", "sqlite", "agents", "hermes-agent", "openclaw", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/DaveTheAve/AgentRecall"
Repository = "https://github.com/DaveTheAve/AgentRecall"
Documentation = "https://github.com/DaveTheAve/AgentRecall#readme"
Issues = "https://github.com/DaveTheAve/AgentRecall/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "setuptools>=77"]
mcp = ["mcp>=1.14,<2"]

[project.scripts]
agent-recall-mcp = "agent_recall_mcp:main"
agent-recall-bridge = "agent_recall_bridge:main"

[tool.setuptools]
packages = ["hermes_plugin"]
py-modules = [
  "agent_recall_core",
  "agent_recall_curator",
  "agent_recall_bridge",
  "agent_recall_mcp",
  "agent_recall_mcp_contracts",
  "agent_recall_mcp_runtime",
  "agent_recall_session_archive",
  "agent_recall_schemas",
  "agent_recall_store",
]

[tool.setuptools.package-data]
hermes_plugin = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
